name: OnePlus 9 ARM64 userspace runtime
on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable runtime release ID
        required: true
        type: string
      sequence:
        description: Increasing runtime catalog sequence
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: oneplus-runtime-publisher
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install signed Ubuntu and LLVM build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg python3-cryptography python3-venv libdrm2 libgbm1 libdbus-1-3 libportaudio2
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.key
          test "$(gpg --show-keys --with-colons /tmp/llvm.key | awk -F: '$1=="fpr"{print $10;exit}')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm.key | sudo tee /usr/share/keyrings/llvm-runtime.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm-runtime.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm-runtime.list
          sudo apt-get update
          sudo apt-get install -y clang-20
      - name: Build userspace package without models, drivers or rootfs
        env:
          RELEASE_ID: ${{ inputs.release }}
        run: /usr/bin/python3 release/runtime/build_profile.py --id "$RELEASE_ID" --output dist --clang 20
      - uses: actions/upload-artifact@v4
        with:
          name: oneplus-arm64-userspace
          path: dist/
          retention-days: 14
      - name: Sign and publish into the existing public update repository
        env:
          RUNTIME_PUBLISHER_KEY: ${{ secrets.RUNTIME_PUBLISHER_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release }}
          CATALOG_SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = sunyu1235/mobilepilot-updates
          test -n "$RUNTIME_PUBLISHER_KEY"
          /usr/bin/python3 release/runtime/sign_catalog.py --profile dist/profile.json --certificate runtime-publisher.json --sequence "$CATALOG_SEQUENCE" --output dist/runtime-catalog.json
          gh release create "$RELEASE_ID" "dist/$RELEASE_ID.tar.gz" dist/profile.json --title "$RELEASE_ID" --notes 'Shared Ubuntu ARM64 userspace only. No Android partitions, models or private adapters.'
          gh release view runtime-stable >/dev/null 2>&1 || gh release create runtime-stable --title 'OnePlus Runtime Catalog' --notes 'Signed, role-limited runtime profile catalog.'
          gh release upload runtime-stable dist/runtime-catalog.json --clobber
